name: Update ChurchTools Org-Chart

on:
  schedule:
    # Runs at 03:00 on day 1 of the month.
    - cron: '0 3 1 * *'
  workflow_dispatch: # Allows manual triggering via the GitHub UI
  push:
    branches:
      - main
    paths:
      - '**.py' # Runs the action when python code is updated on main

jobs:
  generate-and-upload:
    name: Generate & Upload Org-Chart
    runs-on: ubuntu-latest

    # Ensures GitHub loads secrets and variables from the "PROD" environment
    environment: PROD

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: 📦 Install system dependencies (for CairoSVG)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libcairo2-dev libpango1.0-dev

      - name: 🛠️ Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cairosvg

      - name: 🚀 Run Org-Chart Generator
        env:
          # --- Secrets (Configured in the PROD environment) ---
          CT_API_TOKEN: ${{ secrets.CT_API_TOKEN }}
          CT_BASE_URL: ${{ secrets.CT_BASE_URL }}

          # --- Variables (Configured in the PROD environment) ---
          CT_WIKI_CATEGORY_ID: ${{ vars.CT_WIKI_CATEGORY_ID }}
          CT_WIKI_PAGE_TITLE: ${{ vars.CT_WIKI_PAGE_TITLE }}

          # Optional variables with defaults
          CT_FILE_NAME: ${{ vars.CT_FILE_NAME || 'temp_organigram' }}
          CT_GENERATE_PNG: ${{ vars.CT_GENERATE_PNG || 'true' }}
          CT_SPLIT_DEPTH: ${{ vars.CT_SPLIT_DEPTH || '2' }}
          CT_ALLOWED_STATUS_IDS: ${{ vars.CT_ALLOWED_STATUS_IDS || '' }}
          CT_DEBUG: ${{ vars.CT_DEBUG || 'false' }}
        run: |
          python main.py
