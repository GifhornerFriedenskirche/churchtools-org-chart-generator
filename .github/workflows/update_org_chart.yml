name: Update ChurchTools Org Chart

on:
  schedule:
    # Runs automatically at 03:00 UTC on the 1st day of every month
    - cron: '0 3 1 * *'
  workflow_dispatch:
    # Allows you to manually trigger the workflow from the GitHub Actions UI

jobs:
  generate-and-upload:
    name: Generate and Upload SVG
    runs-on: ubuntu-latest

    # Correct key-value syntax for job-level environment variables
    env:
      ENVIRONMENT: PROD

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.14' # Using 3.14 for maximum stability and performance
          cache: 'pip'           # Caches dependencies to significantly speed up future runs

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Execute Script (Generate & Upload)
        env:
          # Securely mapping GitHub Secrets to the environment variables
          # expected by our Python application.
          CT_BASE_URL: ${{ secrets.CT_BASE_URL }}
          CT_API_TOKEN: ${{ secrets.CT_API_TOKEN }}
          CT_WIKI_CATEGORY_ID: ${{ secrets.CT_WIKI_CATEGORY_ID }}
          CT_WIKI_PAGE_TITLE: ${{ secrets.CT_WIKI_PAGE_TITLE }}

          # Force debug mode off in the production runner
          CT_DEBUG: "false"
        run: python main.py
