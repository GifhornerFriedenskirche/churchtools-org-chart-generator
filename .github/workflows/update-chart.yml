name: Generate and Upload Church Organigram

on:
  schedule:
    - cron: '0 3 1 * *' # Daily at 3:00 AM UTC
  workflow_dispatch: # Manual trigger for testing

permissions:
  contents: read # Read-only access to the repository

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python Dependencies
        # Pinned versions for maximum stability and security
        run: pip install requests==2.31.0 graphviz==0.20.3

      - name: Run Generator and Upload
        env:
          CT_BASE_URL: ${{ secrets.CT_BASE_URL }}
          CT_API_TOKEN: ${{ secrets.CT_API_TOKEN }}
          CT_WIKI_CATEGORY_ID: ${{ secrets.CT_WIKI_CATEGORY_ID }}
        run: python generate_chart.py
